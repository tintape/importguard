[project]
name = "importguard"
version = "0.1.0"
description = "Import, validate and reconcile daily sales exports (CSV/Parquet) without double-counting revenue."
authors = [
    { name = "Stepan", email = "344717839+tintape@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "jinja2==3.1.6",
    "psycopg[binary]==3.3.6",
    "pyarrow==26.0.0",
    "pydantic-settings==2.16.1",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[project.scripts]
importguard-worker = "importguard.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real PostgreSQL database (IMPORTGUARD_TEST_DATABASE_URL)"]
addopts = "-ra"

[tool.coverage.run]
source = ["importguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "S608", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S105", "S106", "PLR0915", "S311"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["importguard"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
