<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block head_extra %}{% endblock %}
  <title>{% block title %}ImportGuard{% endblock %} · ImportGuard</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.5 2.5 3.8v3.8c0 3.3 2.3 6 5.5 6.9 3.2-.9 5.5-3.6 5.5-6.9V3.8L8 1.5Z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="m5.5 8 1.8 1.8L10.8 6.3" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        ImportGuard
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/" {% if active == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
        <a href="/imports" {% if active in ('imports', 'import_detail') %}aria-current="page"{% endif %}>Imports</a>
        <a href="/sales" {% if active == 'sales' %}aria-current="page"{% endif %}>Sales</a>
      </nav>
      <span class="topbar-note">Local demo · synthetic data · times in {{ report_timezone }}</span>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site">ImportGuard · local single-operator tool, not a hosted service.</footer>
</body>
</html>
